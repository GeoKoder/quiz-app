<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="start-screen" id="start-screen">
        <h1>The Quiz App</h1>
        <p>The quiz app you've been waiting for. Making your weekends feel shorter and more lively.</p>
        <button class="start-btn" id="start-btn">Start Quiz</button>
        <div class="previous-score" id="previous-score"></div>
    </div>

    <div class="quiz-screen" id="quiz-screen">
        <div class="quiz-meta-header">
            <div class="current-score-disp" id="current-score-disp"></div>
            <div class="timer-display" id="timer-display">⏱️ 15s</div>
        </div>
        <div class="progress-bar" id="progress-bar"></div>
        <div class="question-text" id="question-text"></div>
        <div class="answer-buttons" id="answer-buttons"></div>
    </div>

    <div class="results-screen" id="results-screen">
        <div class="letter-grade" id="letter-grade"></div>
        <div class="final-score" id="final-score"></div>
        <div class="score-percentage" id="score-percentage"></div>
        <div class="message" id="message"></div>
        <div class="review-buttons">
            <button id="review-btn">Review Answers</button>
            <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <div class="review-screen" id="review-screen">
        <div class="card-container" id="card-container"></div>
        <button id="results-btn">Back to Results</button>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
