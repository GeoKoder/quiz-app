<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="start-screen">
        <h1>The Quiz App</h1>
        <p>The quiz app you've been waiting for. Making your weekends feel shorter and more lively.</p>
        <button class="start-btn">Start Quiz</button>
    </div>

    <div class="quiz-screen">
        <div class="progress-bar"></div>
        <div class="question-text"></div>
        <div class="answer-buttons"></div>
        <div class="current-score-disp"></div>
    </div>

    <div class="results-screen">
        <div class="final-score"></div>
        <div class="letter-grade"></div>
        <div class="message"></div>
        <div class="review-buttons">
            <button id="review-btn">Review Answers</button>
            <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <div class="review-screen">
        <div class="card-container"></div>
        <button id="results-btn"></button>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
